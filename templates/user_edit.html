{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">USER ADMINISTRATION</div><h1>Edit user account</h1><p class="muted">Update account details, role, department, or password.</p></div><a class="secondary btn" href="{{ url_for('users') }}">Back to User Accounts</a></div><section class="panel formpanel wide-form"><form method="post" action="{{ url_for('edit_user',user_id=user.id) }}" class="form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="form-grid two"><label><span>Full name <b class="required">*</b></span><input name="full_name" value="{{ user.full_name }}" required></label><label><span>Employee ID <b class="required">*</b></span><input name="employee_id" value="{{ user.employee_id }}" required></label><label><span>Username <b class="required">*</b></span><input name="username" value="{{ user.username }}" required></label><label><span>Work email <b class="required">*</b></span><input type="email" name="email" value="{{ user.email }}" required></label><label><span>Role <b class="required">*</b></span><select name="role">{% for r in roles %}<option value="{{ r.name }}" {% if user.role_id==r.id %}selected{% endif %}>{{ r.display_name }}</option>{% endfor %}</select></label><label><span>Department</span><select name="department_id"><option value="">Not assigned</option>{% for d in departments %}<option value="{{ d.id }}" {% if user.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label></div><label><span>New password</span><input type="password" name="password" minlength="12" placeholder="Leave blank to keep the current password"><small>Minimum 12 characters.</small></label><div class="form-footer"><span class="muted">Changes are recorded in the system activity log.</span><div class="actions"><a class="secondary btn" href="{{ url_for('users') }}">Cancel</a><button class="primary" type="submit">Save changes</button></div></div></form></section>{% endblock %}
