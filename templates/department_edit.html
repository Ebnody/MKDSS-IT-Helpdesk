{% extends "base.html" %}{% block content %}
<div class="head"><div><h1>Edit department</h1><p class="muted">Update the department name, description, and optional sections.</p></div><a class="secondary btn" href="{{url_for('departments')}}">Back to departments</a></div>
<section class="panel formpanel"><form method="post" action="{{url_for('edit_department',department_id=department.id)}}" class="form">
<input type="hidden" name="_csrf" value="{{csrf_token()}}">
<label>Department name<input name="name" value="{{department.name}}" required></label>
<label>Description<input name="description" value="{{department.description or ''}}"></label>
<label>Sections <span class="muted small-help">Optional. One section per line or comma-separated. Removing a section deactivates it rather than deleting history.</span><textarea name="sections" rows="7" placeholder="IT&#10;Security&#10;Compliance">{% for s in sections %}{{s.name}}{% if not loop.last %}
{% endif %}{% endfor %}</textarea></label>
<button class="primary">Save changes</button>
</form></section>
{% endblock %}
