{% extends "base.html" %}{% block content %}<div class="head"><div><h1>Change password</h1><p class="muted">Use at least 12 characters.</p></div></div><section class="panel narrow"><form method="post" class="form"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="12" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="12" required></label><button class="primary">Change password</button></form></section>{% endblock %}
